name: avito-recap

x-logging: &default-logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    image: caddy:2.11.4-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.20"
    logging: *default-logging

  frontend:
    image: ghcr.io/avito-hackaton-team/avito-recap-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    expose:
      - "80"
    depends_on:
      recap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.20"
    logging: *default-logging

  recap:
    image: ghcr.io/avito-hackaton-team/avito-recap-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 384m
    cpus: "0.50"
    logging: *default-logging

  seed:
    image: ghcr.io/avito-hackaton-team/avito-recap-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    entrypoint: ["/app/seed"]
    command: ["--year=${RECAP_YEAR:-2026}", "--seed=20260807"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 384m
    cpus: "0.50"
    logging: *default-logging

  postgres:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: "0.50"
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
