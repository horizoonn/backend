services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_RECAP_YEAR: "${RECAP_YEAR:-2026}"

    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_EXTERNAL_PORT:-3000}:80"

    depends_on:
      - recap

    restart: unless-stopped

  recap:
    build:
      context: ./backend/recap
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

    ports:
      - "${HTTP_BIND_HOST}:${HTTP_EXTERNAL_PORT}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

    restart: on-failure
    stop_grace_period: 20s

  seed:
    build:
      context: ./backend/recap
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

    entrypoint: ["/app/seed"]
    command: ["--year=2026", "--seed=20250807"]

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  postgres:
    image: postgres:18.1-bookworm

    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

    ports:
      - "${POSTGRES_BIND_HOST}:${POSTGRES_EXTERNAL_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped

volumes:
  postgres_data:
