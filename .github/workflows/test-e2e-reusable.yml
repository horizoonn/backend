name: End-to-end tests reusable

on:
  workflow_call:
    inputs:
      go-version-file:
        required: true
        type: string

permissions:
  contents: read

jobs:
  e2e-test:
    name: Run backend E2E tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: false

      - name: Generate code
        run: make generate

      - name: Run backend E2E tests
        run: make test-e2e
