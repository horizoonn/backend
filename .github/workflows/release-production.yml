name: Release production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  integration-test:
    uses: ./.github/workflows/test-integration-reusable.yml
    with:
      go-version-file: backend/recap/go.mod

  e2e-test:
    needs: integration-test
    uses: ./.github/workflows/test-e2e-reusable.yml
    with:
      go-version-file: backend/recap/go.mod

  publish-images:
    name: Publish Docker images
    needs: e2e-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/recap/go.mod
          cache: false

      - name: Generate backend API
        run: make generate-api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6.18.0
        with:
          context: backend/recap
          push: true
          tags: ghcr.io/avito-hackaton-team/avito-recap-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6.18.0
        with:
          context: frontend
          push: true
          build-args: VITE_RECAP_YEAR=2026
          tags: ghcr.io/avito-hackaton-team/avito-recap-frontend:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-production:
    needs: publish-images
    uses: ./.github/workflows/deploy-production.yml
    with:
      image-tag: ${{ github.sha }}
    secrets: inherit
